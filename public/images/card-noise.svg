<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
<rect width="160" height="160" fill="#607478" filter="url(#sapphireNoise)"/>
<defs>
<filter id="sapphireNoise" x="0" y="0" width="160" height="160" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" seed="4" result="noise"/>
<feColorMatrix in="noise" type="luminanceToAlpha" result="alphaNoise"/>
<feComposite operator="in" in="SourceGraphic" in2="alphaNoise" result="monoNoise"/>
</filter>
</defs>
</svg>
